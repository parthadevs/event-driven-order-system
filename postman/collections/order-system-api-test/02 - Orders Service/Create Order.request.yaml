$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 1
        }
      ]
    }
order: 1000
